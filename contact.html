    <main>
        <section>
            <form method="post" action="#">
                <label for="name">Ім'я:</label>
                <input type="text" id="name" name="name" placeholder="Введіть ваше ім'я" required>
                <label for="email">Електронна пошта:</label>
                <input type="email" id="email" name="email" placeholder="example@email.com" required>
                <label for="subject">Тема повідомлення:</label>
                <input type="text" id="subject" name="subject" placeholder="Тема">
                <label for="message">Повідомлення:</label>
                <textarea id="message" name="message" rows="6" placeholder="Ваше повідомлення"></textarea>
                <button type="submit">Надіслати</button>
            </form>
        </section>
